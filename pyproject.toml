[project]
name = "sleepwatch"
version = "0.1.0"
description = "Personalized sleep staging and anomaly detection from Apple Watch heart rate and accelerometry, with an LLM follow-up agent."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    { name = "enricotazzer", email = "enrico.tappo00@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "numpy>=2.5.3",
    "pandas>=3.0.6",
    "pyarrow>=25.0.1",
    "pydantic>=2.13.5",
    "pydantic-settings>=2.15.0",
    "pyyaml>=6.0.3",
    "scikit-learn>=1.9.1",
    "scipy>=1.18.1",
    "typer>=0.27.2",
]

[project.scripts]
sleepwatch = "sleepwatch.cli:app"

[build-system]
requires = ["uv_build>=0.12.19,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "ipykernel>=7.4.0",
    "matplotlib>=3.11.2",
    "nbconvert>=7.17.1",
    "nbformat>=5.11.1",
    "pre-commit>=4.6.2",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "ruff>=0.16.9",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "NPY", "RUF"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["--strict-markers", "-ra"]
markers = [
    "data: needs the raw dataset; skipped when data/raw has no SHA256SUMS.txt",
    "slow: long-running",
    "llm: needs a running LLM backend",
]
